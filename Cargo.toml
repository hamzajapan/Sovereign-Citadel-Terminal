[workspace]
members = [
    "cli",
    "crates/scp-core",
    "crates/scp-signer",
    "crates/scp-dlc",
    "crates/scp-vault",
    "crates/scp-agent",
    "crates/scp-economics",
    "crates/scp-chain",
    "crates/scp-ui/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sovereign Citadel Engineers"]
license = "MIT"
repository = "https://github.com/sovereign-citadel/scp"
description = "A non-custodial, Bitcoin-native liquidity and prediction layer"

[workspace.dependencies]
# --- Internal Crates ---
scp-core = { path = "crates/scp-core" }
scp-signer = { path = "crates/scp-signer" }
scp-dlc = { path = "crates/scp-dlc" }
scp-vault = { path = "crates/scp-vault" }
scp-agent = { path = "crates/scp-agent" }
scp-economics = { path = "crates/scp-economics" }

# --- Bitcoin & Crypto ---
bitcoin = { version = "0.32", features = ["rand", "serde"] }
secp256k1 = { version = "0.29", features = ["global-context", "rand", "serde"] }
rand = "0.8"
bdk_wallet = { version = "1.0" }

# NOTE: rust-dlc crates would be used in production
# dlc = { version = "0.4" }
# dlc-manager = { version = "0.4" }

# --- Async Runtime ---
tokio = { version = "1.35", features = ["full"] }

# --- Persistence ---
sled = "0.34"

# --- Error Handling ---
anyhow = "1.0"
thiserror = "1.0"

# --- Serialization ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- Logging ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- CLI ---
clap = { version = "4.4", features = ["derive"] }

# --- HTTP (for Agent) ---
reqwest = { version = "0.12", features = ["json"] }

# --- Configuration ---
toml = "0.8"

# --- Testing ---
tempfile = "3.10"
