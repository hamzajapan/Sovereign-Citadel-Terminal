[package]
name = "scp-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line interface for the Sovereign Citadel Protocol"

[[bin]]
name = "scp"
path = "src/main.rs"

[dependencies]
scp-core = { path = "../crates/scp-core" }
scp-signer = { path = "../crates/scp-signer" }
scp-dlc = { path = "../crates/scp-dlc" }
scp-vault = { path = "../crates/scp-vault" }
scp-agent = { path = "../crates/scp-agent" }
scp-economics = { path = "../crates/scp-economics" }
scp-chain = { path = "../crates/scp-chain", features = ["bdk"] }

clap = { workspace = true, features = ["derive"] }
tokio.workspace = true
bitcoin.workspace = true
secp256k1.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"

[dev-dependencies]
tempfile = { workspace = true }
